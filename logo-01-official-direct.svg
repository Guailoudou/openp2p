<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OpenP2P Direct Connection</title>
  <desc id="desc">Two blue peers joined by the green direct path used on the OpenP2P website.</desc>
  <defs>
    <linearGradient id="tile" x1="72" y1="56" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263136"/>
      <stop offset=".52" stop-color="#161C1F"/>
      <stop offset="1" stop-color="#0B1113"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#82D4FF"/>
      <stop offset=".48" stop-color="#58B3E8"/>
      <stop offset="1" stop-color="#34769E"/>
    </linearGradient>
    <linearGradient id="direct" x1="184" y1="256" x2="328" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7F34A"/>
      <stop offset=".48" stop-color="#4DDB4A"/>
      <stop offset="1" stop-color="#00C978"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="48" y="48" width="416" height="416" rx="112"/></clipPath>
  </defs>
  <rect x="48" y="48" width="416" height="416" rx="112" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <circle cx="108" cy="104" r="92" fill="#78CCF9" opacity=".075"/>
    <circle cx="424" cy="424" r="122" fill="#00C978" opacity=".065"/>
  </g>
  <rect x="84" y="192" width="128" height="128" rx="40" fill="url(#node)" stroke="#BDE9FF" stroke-opacity=".22" stroke-width="4"/>
  <rect x="300" y="192" width="128" height="128" rx="40" fill="url(#node)" stroke="#BDE9FF" stroke-opacity=".22" stroke-width="4"/>
  <path d="M190 256h132" fill="none" stroke="#092118" stroke-opacity=".38" stroke-width="38" stroke-linecap="round"/>
  <path d="M190 256h132" fill="none" stroke="url(#direct)" stroke-width="26" stroke-linecap="round"/>
  <path d="m210 232-26 24 26 24M302 232l26 24-26 24" fill="none" stroke="#C9F75A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="148" cy="256" r="21" fill="#F4FAFF"/>
  <circle cx="364" cy="256" r="21" fill="#F4FAFF"/>
  <circle cx="148" cy="256" r="7" fill="#3F8BB6"/>
  <circle cx="364" cy="256" r="7" fill="#3F8BB6"/>
</svg>
