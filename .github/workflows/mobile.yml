name: Mobile Builds

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-22.04
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.io,direct
      GOMOBILE_VERSION: 7c4916698cc93475ebfea76748ee0faba2deb2a5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-31 build-tools;30.0.3 ndk;21.4.7075529

      - name: Build Go Android library
        run: |
          mkdir -p app/app/libs artifacts/android
          cp go.mod android.mod
          cp go.sum android.sum
          export GOFLAGS="-modfile=$GITHUB_WORKSPACE/android.mod"
          export PATH="$(go env GOPATH)/bin:$PATH"

          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
          go get "golang.org/x/mobile/bind@$GOMOBILE_VERSION"
          gomobile bind -target android -androidapi 16 -o app/app/libs/openp2p.aar ./core

          test -s app/app/libs/openp2p.aar
          test -s app/app/libs/openp2p-sources.jar
          cp app/app/libs/openp2p.aar app/app/libs/openp2p-sources.jar artifacts/android/

      - name: Build unsigned Android packages
        working-directory: app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

          APK="$(find app/build/outputs/apk/release -name '*-unsigned.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          cp "$APK" "$AAB" ../artifacts/android/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openp2p-android
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14

  harmonyos:
    name: HarmonyOS arm64
    runs-on: ubuntu-22.04
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.io,direct
      DEVECO_COMMAND_LINE_TOOLS_URL: ${{ secrets.DEVECO_COMMAND_LINE_TOOLS_URL || vars.DEVECO_COMMAND_LINE_TOOLS_URL }}
      DEVECO_COMMAND_LINE_TOOLS_SHA256: ${{ secrets.DEVECO_COMMAND_LINE_TOOLS_SHA256 || vars.DEVECO_COMMAND_LINE_TOOLS_SHA256 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
          cache-dependency-path: go.sum

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang cmake file libgl1-mesa-dev lld ninja-build unzip

      - name: Install HarmonyOS Command Line Tools
        run: |
          if [[ -z "$DEVECO_COMMAND_LINE_TOOLS_URL" || -z "$DEVECO_COMMAND_LINE_TOOLS_SHA256" ]]; then
            echo "::error::Configure DEVECO_COMMAND_LINE_TOOLS_URL and DEVECO_COMMAND_LINE_TOOLS_SHA256 as repository secrets or variables."
            exit 1
          fi

          ARCHIVE="$RUNNER_TEMP/command-line-tools.zip"
          DEST="$RUNNER_TEMP/deveco"
          curl -fL --retry 3 --retry-delay 5 "$DEVECO_COMMAND_LINE_TOOLS_URL" -o "$ARCHIVE"
          echo "$DEVECO_COMMAND_LINE_TOOLS_SHA256  $ARCHIVE" | sha256sum -c -
          mkdir -p "$DEST"
          unzip -q "$ARCHIVE" -d "$DEST"

          CLT_ROOT="$(find "$DEST" -type d -name command-line-tools -print -quit)"
          test -n "$CLT_ROOT"
          test -d "$CLT_ROOT/sdk/default/openharmony/native"
          echo "DEVECO_TOOLS_HOME=$CLT_ROOT" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$CLT_ROOT/sdk" >> "$GITHUB_ENV"
          echo "OHOS_NATIVE_ROOT=$CLT_ROOT/sdk/default/openharmony/native" >> "$GITHUB_ENV"
          echo "$CLT_ROOT/bin" >> "$GITHUB_PATH"
          echo "$CLT_ROOT/tool/node/bin" >> "$GITHUB_PATH"

      - name: Verify HarmonyOS tools
        run: |
          java -version
          node --version
          ohpm --version
          hvigorw --version
          test -x "$OHOS_NATIVE_ROOT/llvm/bin/clang"

      - name: Build OpenHarmony-SIG Go
        run: |
          BOOTSTRAP_GOROOT="$(go env GOROOT)"
          SIG_GO="$RUNNER_TEMP/ohos_golang_go"
          git clone --depth 1 --branch release-branch.go1.24 \
            https://gitcode.com/openharmony-sig/ohos_golang_go.git "$SIG_GO"
          (cd "$SIG_GO/src" && GOROOT_BOOTSTRAP="$BOOTSTRAP_GOROOT" ./make.bash)
          "$SIG_GO/bin/go" tool dist list | grep -qx 'openharmony/arm64'
          echo "OHOS_GO_ROOT=$SIG_GO" >> "$GITHUB_ENV"

      - name: Build and verify HarmonyOS Go core
        run: |
          RESOURCE_VERSION="$(find "$OHOS_NATIVE_ROOT/llvm/lib/clang" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          test -n "$RESOURCE_VERSION"
          CC_WRAPPER="$RUNNER_TEMP/ohos-clang"
          cat > "$CC_WRAPPER" <<'EOF'
          #!/bin/sh
          set -eu
          exec "$OHOS_NATIVE_ROOT/llvm/bin/clang" \
            --target=aarch64-linux-ohos \
            --sysroot="$OHOS_NATIVE_ROOT/sysroot" \
            -resource-dir="$OHOS_NATIVE_ROOT/llvm/lib/clang/$OHOS_CLANG_RESOURCE_VERSION" \
            "$@" \
            -L"$OHOS_NATIVE_ROOT/llvm/lib/aarch64-linux-ohos" \
            -fuse-ld=lld \
            -Wno-unused-command-line-argument
          EOF
          chmod 755 "$CC_WRAPPER"

          cp go.sum oh.go.sum
          mkdir -p artifacts/harmonyos ohos/entry/libs/arm64-v8a

          export GOROOT="$OHOS_GO_ROOT"
          export PATH="$GOROOT/bin:$PATH"
          export GOOS=openharmony
          export GOARCH=arm64
          export CGO_ENABLED=1
          export CC="$CC_WRAPPER"
          export OHOS_CLANG_RESOURCE_VERSION="$RESOURCE_VERSION"

          go version
          go env GOOS GOARCH CGO_ENABLED CC GOROOT
          go build -modfile=oh.go.mod -mod=readonly -tags openharmony \
            -buildmode=c-shared -trimpath -ldflags=-s \
            -o artifacts/harmonyos/libopenp2p_ohos.so ./cmd

          SO=artifacts/harmonyos/libopenp2p_ohos.so
          HEADER=artifacts/harmonyos/libopenp2p_ohos.h
          file "$SO"
          readelf -h "$SO" | tee artifacts/harmonyos/elf-header.txt
          readelf -d "$SO" | tee artifacts/harmonyos/dynamic-section.txt
          readelf -rW "$SO" | grep -Ei 'TLS|TLSDESC' | tee artifacts/harmonyos/tls-relocations.txt || true
          nm -D --defined-only "$SO" | tee artifacts/harmonyos/exported-symbols.txt
          grep -q 'Machine:.*AArch64' artifacts/harmonyos/elf-header.txt
          ! grep -Eq 'libc\.so\.6|ld-linux-aarch64' artifacts/harmonyos/dynamic-section.txt
          for symbol in OpenP2PStart OpenP2PStartWithNode OpenP2PStop OpenP2PGetStatus OpenP2PGetLastError OpenP2PGetSDWANConfig OpenP2PGetNodeName OpenP2PGetHealth OpenP2PReadTun OpenP2PWriteTun OpenP2PIsRunning; do
            grep -Eq " T ${symbol}$" artifacts/harmonyos/exported-symbols.txt
          done
          sha256sum "$SO" "$HEADER" > artifacts/harmonyos/SHA256SUMS
          cp "$SO" "$HEADER" ohos/entry/libs/arm64-v8a/

      - name: Build unsigned HarmonyOS HAP
        working-directory: ohos
        run: |
          ohpm install --all
          (cd entry && ohpm install --all)
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default -p module=entry@default -p buildMode=release --no-daemon

          HAP="$(find entry/build/default/outputs/default -name '*-unsigned.hap' -print -quit)"
          test -n "$HAP" && test -s "$HAP"
          unzip -q "$HAP" -d "$RUNNER_TEMP/hap-content"
          PACKAGED_SO="$(find "$RUNNER_TEMP/hap-content" -name libopenp2p_ohos.so -print -quit)"
          test -n "$PACKAGED_SO"
          cmp ../artifacts/harmonyos/libopenp2p_ohos.so "$PACKAGED_SO"
          cp "$HAP" ../artifacts/harmonyos/

          LIBENTRY="$(find entry/build/default/intermediates -name libentry.so -print -quit)"
          test -n "$LIBENTRY" && cp "$LIBENTRY" ../artifacts/harmonyos/

      - name: Upload HarmonyOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openp2p-harmonyos-arm64
          path: artifacts/harmonyos/
          if-no-files-found: warn
          retention-days: 14
