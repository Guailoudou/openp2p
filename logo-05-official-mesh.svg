<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OpenP2P Shared Mesh</title>
  <desc id="desc">Private peers use direct green and shared blue and yellow routes.</desc>
  <defs>
    <linearGradient id="tile" x1="72" y1="64" x2="440" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#212629"/>
      <stop offset="0.52" stop-color="#172022"/>
      <stop offset="1" stop-color="#101314"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#82CBFA"/>
      <stop offset="0.55" stop-color="#5CA8D8"/>
      <stop offset="1" stop-color="#39789F"/>
    </linearGradient>
    <linearGradient id="direct" x1="151" y1="350" x2="361" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7E653"/>
      <stop offset="0.5" stop-color="#8BD33F"/>
      <stop offset="1" stop-color="#67B936"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(256 278) rotate(90) scale(170)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58B6E8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#58B6E8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="48" y="48" width="416" height="416" rx="112" fill="url(#tile)"/>
  <circle cx="256" cy="278" r="170" fill="url(#halo)"/>
  <path d="M256 153 361 350" fill="none" stroke="#60B9F1" stroke-width="16" stroke-linecap="round" stroke-dasharray="2 24"/>
  <path d="M151 350 256 153" fill="none" stroke="#FFD21A" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 22"/>
  <path d="M151 350h210" fill="none" stroke="url(#direct)" stroke-width="24" stroke-linecap="round"/>
  <g fill="url(#node)" stroke="#BFEAFF" stroke-opacity="0.34" stroke-width="5">
    <circle cx="256" cy="153" r="58"/>
    <circle cx="151" cy="350" r="58"/>
    <circle cx="361" cy="350" r="58"/>
  </g>
  <g fill="#F5FAFE">
    <circle cx="256" cy="153" r="18"/>
    <circle cx="151" cy="350" r="18"/>
    <circle cx="361" cy="350" r="18"/>
  </g>
  <g fill="#285B79">
    <circle cx="256" cy="153" r="7"/>
    <circle cx="151" cy="350" r="7"/>
    <circle cx="361" cy="350" r="7"/>
  </g>
</svg>
